<div class="space-y-4 p-3">
  @for (item of items(); track item.id) {
    <article class="rounded-lg border border-solid border-gray-200 p-4">
      <div class="flex gap-3">
        <img
          class="h-24 w-24 shrink-0 rounded object-contain"
          [src]="item.product"
          [alt]="item.name"
        />

        <div class="min-w-0 flex-1">
          <h2 class="line-clamp-2 font-medium">
            {{ item.name }}
          </h2>

          <p class="mt-2 text-lg font-semibold">
            {{ item.price | currency }}
          </p>
        </div>

        <button
          type="button"
          mat-icon-button
          color="warn"
          [attr.aria-label]="'Remove ' + item.name"
          (click)="removeItem.emit(item)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </div>

      <div
        class="mt-4 flex items-center justify-between border-t border-solid border-gray-200 pt-4"
      >
        <div class="flex items-center">
          <button
            type="button"
            mat-icon-button
            [attr.aria-label]="'Decrease quantity of ' + item.name"
            (click)="removeQuantity.emit(item)"
          >
            <mat-icon>remove</mat-icon>
          </button>

          <span class="min-w-8 text-center text-lg">
            {{ item.quantity }}
          </span>

          <button
            type="button"
            mat-icon-button
            [attr.aria-label]="'Increase quantity of ' + item.name"
            (click)="addQuantity.emit(item)"
          >
            <mat-icon>add</mat-icon>
          </button>
        </div>

        <div class="text-right">
          <span class="block text-xs text-gray-500">Total</span>
          <strong>{{ item.quantity * item.price | currency }}</strong>
        </div>
      </div>
    </article>
  }

  <div class="rounded-lg bg-gray-50 p-4">
    <div class="mb-4 flex items-center justify-between text-lg">
      <span>Order total</span>
      <strong>{{ total() | currency }}</strong>
    </div>

    <div class="flex flex-col gap-3">
      <button
        type="button"
        mat-raised-button
        color="primary"
        class="w-full"
        (click)="checkout.emit()"
      >
        Proceed To Checkout
      </button>

      <button
        type="button"
        mat-stroked-button
        class="w-full"
        routerLink="/home"
      >
        Continue shopping
      </button>

      <button
        type="button"
        mat-button
        color="warn"
        class="w-full"
        (click)="clearCart.emit()"
      >
        Clear cart
      </button>
    </div>
  </div>
</div>
