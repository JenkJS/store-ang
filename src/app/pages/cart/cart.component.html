@if (!isEmpty()) {
  <section class="p-3 sm:p-6">
    <mat-card class="mx-auto max-w-7xl overflow-hidden">
      <div class="md:hidden">
        <app-cart-mobile
          [items]="items()"
          [total]="total()"
          (addQuantity)="onAddQuantity($event)"
          (removeQuantity)="onRemoveQuantity($event)"
          (removeItem)="onRemoveItem($event)"
          (clearCart)="onClearCart()"
          (checkout)="onCheckout()"
        />
      </div>

      <div class="hidden md:block">
        <app-cart-desktop
          [items]="items()"
          [total]="total()"
          (addQuantity)="onAddQuantity($event)"
          (removeQuantity)="onRemoveQuantity($event)"
          (removeItem)="onRemoveItem($event)"
          (clearCart)="onClearCart()"
          (checkout)="onCheckout()"
        />
      </div>
    </mat-card>
  </section>
} @else {
  <section class="p-3 sm:p-6">
    <mat-card class="mx-auto max-w-7xl p-4 sm:p-6">
      <p class="flex flex-col items-start gap-3 sm:flex-row sm:items-center">
        Your cart is empty.

        <button mat-raised-button routerLink="/home">
          Start shopping
        </button>
      </p>
    </mat-card>
  </section>
}
