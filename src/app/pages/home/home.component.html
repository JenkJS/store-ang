<mat-drawer-container class="home-shell" [autosize]="true">
  <mat-drawer
    #drawer
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    class="filters-drawer"
  >
    <app-filters (showCategory)="onShowCategory($event, drawer)" />
  </mat-drawer>

  <mat-drawer-content class="p-3 sm:p-4 lg:p-6">
    @if (isMobile()) {
      <button type="button" mat-stroked-button class="mb-3 w-full" (click)="drawer.open()">
        <mat-icon>filter_list</mat-icon>
        Filters
      </button>
    }

    <app-products-header
      (columnsCountChange)="onColumnsCountChange($event)"
      (sortChange)="onSortChange($event)"
      (itemsCountChange)="onItemsCountChange($event)"
    >
    </app-products-header>
    <mat-grid-list gutterSize="16" [cols]="cols()" [rowHeight]="rowHeight()">
      @for (product of products(); track product.id) {
        <mat-grid-tile>
          <app-product-card
            [product]="product"
            (addToCart)="onAddToCart($event)"
            class="w-full"
            [fullWidthMode]="cols() === 1 && !isMobile()"
          />
        </mat-grid-tile>
      }
    </mat-grid-list>
  </mat-drawer-content>
</mat-drawer-container>
