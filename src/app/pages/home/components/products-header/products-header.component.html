<mat-card class="mb-4">
  <div class="flex flex-col gap-2 px-2 py-1 sm:flex-row sm:items-center sm:justify-between sm:px-4">
    <div>
      <button mat-button [mat-menu-trigger-for]="sortByMenu">
        Sort by {{ sort() }}
        <mat-icon>expand_more</mat-icon>
      </button>
      <mat-menu #sortByMenu="matMenu">
        <button (click)="onSortUpdated('desc')" mat-menu-item>desc</button>
        <button (click)="onSortUpdated('asc')" mat-menu-item>asc</button>
      </mat-menu>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-1 sm:justify-end">
      <div>
        <button mat-button [matMenuTriggerFor]="menu">
          Show {{ itemsShowCount() }}
          <mat-icon>expand_more</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button (click)="onItemsUpdated(12)" mat-menu-item>12</button>
          <button (click)="onItemsUpdated(24)" mat-menu-item>24</button>
          <button (click)="onItemsUpdated(36)" mat-menu-item>36</button>
        </mat-menu>
      </div>
      <button
        type="button"
        mat-icon-button
        class="hidden sm:inline-flex"
        aria-label="Show products as a list"
        (click)="onColumnsUpdated(1)"
      >
        <mat-icon>view_list</mat-icon>
      </button>
      <button
        type="button"
        mat-icon-button
        class="hidden sm:inline-flex"
        aria-label="Show products in three columns"
        (click)="onColumnsUpdated(3)"
      >
        <mat-icon>view_module</mat-icon>
      </button>
      <button
        type="button"
        mat-icon-button
        class="hidden lg:inline-flex"
        aria-label="Show products in four columns"
        (click)="onColumnsUpdated(4)"
      >
        <mat-icon>view_comfy</mat-icon>
      </button>
    </div>
  </div>
</mat-card>
