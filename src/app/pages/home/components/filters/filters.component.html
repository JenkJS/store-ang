@if (categories().length) {
  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>{{ 'Categories' | uppercase }} </mat-panel-title>
    </mat-expansion-panel-header>
    <mat-selection-list [multiple]="false">
      @for (category of categories(); track category) {
        <mat-list-option value="category">
          <button type="button" (click)="onShowCategory(category)">
            {{ category | uppercase }}
          </button>
        </mat-list-option>
      }
    </mat-selection-list>
  </mat-expansion-panel>
}
