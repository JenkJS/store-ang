<mat-toolbar color="primary">
  <div class="w-full max-w-7xl mx-auto flex items-center justify-between px-4 sm:px-6">
    <a class="font-semibold" routerLink="/home">Store</a>
    <button
      type="button"
      mat-icon-button
      aria-label="Open shopping cart"
      [mat-menu-trigger-for]="menu"
    >
      <mat-icon
        [matBadge]="itemsQuantity()"
        [matBadgeHidden]="!itemsQuantity()"
        matBadgeColor="warn"
      >
        shopping_bag
      </mat-icon>
    </button>
  </div>

  <mat-menu #menu="matMenu" panelClass="cart-menu-panel">
    <div class="p-3 divide-y divide-solid">
      <div class="pb-3 flex items-center justify-between gap-4">
        <span>{{ itemsQuantity() }} Items</span>
        <a class="shrink-0" routerLink="/cart">View Cart</a>
      </div>
      @if (cart().items.length) {
        <div class="py-3">
          @for (item of cart().items; track item.id) {
            <div class="flex items-start justify-between gap-3 font-light mb-2">
              <span class="min-w-0 break-words">{{ item.name }} × {{ item.quantity }}</span>
              <span class="shrink-0 font-bold">{{ item.price | currency }}</span>
            </div>
          }
        </div>
      }
      <div class="flex justify-between py-3 font-light">
        Total:
        <span class="font-bold">{{ total() | currency }} </span>
      </div>
      <div class="pt-3 flex justify-between">
        <button type="button" aria-label="Clear cart" (click)="onClearCart()">
          <mat-icon>delete</mat-icon>
        </button>
        <a aria-label="View cart" routerLink="/cart"><mat-icon>shopping_cart</mat-icon></a>
      </div>
    </div>
  </mat-menu>
</mat-toolbar>
