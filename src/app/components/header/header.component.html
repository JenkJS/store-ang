<mat-toolbar color="primary">
    <div
    class="w-full max-w-7xl mx-auto flex items-center justify-between"
  >
  <a routerLink="/home">Store</a>
  <button mat-icon-button [mat-menu-trigger-for]="menu">
    <mat-icon [matBadge]="itemsQuantity()" [matBadgeHidden]="!itemsQuantity()" matBadgeColor="warn"
      >shopping_bag</mat-icon
    >
  </button>
    </div>
  <mat-menu #menu="matMenu">
    <div class="p-3 divide-y divide-solid">
      <div class="pb-3 flex justify-between">
        <span class="mr-16">{{ itemsQuantity() }} Items</span>
        <a routerLink="/cart">View Cart</a>
      </div>
      @if (cart().items.length) {
        <div class="py-3">
          @for (item of cart().items; track item.id) {
            <div class="flex justify-between font-light mb-2">
              {{ item.name }} x {{ item.quantity }}
              <span class="font-bold">{{ item.price | currency }}</span>
            </div>
          }
        </div>
      }
      <div class="flex justify-between py-3 font-light">
        Total:
        <span class="font-bold">{{ total() | currency }} </span>
      </div>
      <div class="pt-3 flex justify-between">
        <button (click)="onClearCart()"><mat-icon>delete</mat-icon></button>
        <button routerLink="/cart"><mat-icon>shopping_cart</mat-icon></button>
      </div>
    </div>
  </mat-menu>
</mat-toolbar>
